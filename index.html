<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge"> <!-- Internet Explorer compatibility -->
  <meta name="description" content="Simple Card that shows QR code"> <!-- Description for search engines -->
  <meta name="keywords" content="HTML, CSS, Responsive Design, QR Code, QR, Code"> <!-- Keywords for search engines -->
  <meta name="author" content="Daniel Velez"> <!-- Author name -->
  <title>QR Code Application</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
  <!-- Personal CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <!-- Card Container -->
     <article class="card-container">
      <!-- QR Code -->
      <img src="images/image-qr-code.png" alt="Site QR Code">

      <h1>Improve your front-end Skills by building projects</h1>
      <p>
        Scan the QR code to visit Frontend Mentor and take your coding skills to the 
        next level
      </p>
     </article>
  </main>
</body>
</html>
